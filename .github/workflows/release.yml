# .github/workflows/release.yml

# Build + test + release pipeline for APECS Guardian.
#
# Runs on the self-hosted `runner` VPS (LunaNode). On every push to master it
# builds and tests. On a version tag (v*) it additionally cross-compiles the
# Windows binary, packages a Linux AppImage, generates SHA-256 checksums, and
# publishes a GitHub Release with all artifacts attached.
#
# Self-hosted because the APECS GitHub account has a billing lock (no
# GitHub-hosted runner minutes); self-hosted runners are free.

name: release

on:
    push:
        branches: [master]
        tags: ['v*']

env:
    CARGO_TERM_COLOR: always

# The default GITHUB_TOKEN is read-only on this repo; release creation needs
# contents: write (without it the publish step gets HTTP 403).
permissions:
    contents: write

jobs:
    build:
        runs-on: [self-hosted, linux, x64, guardian]

        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Toolchain
              run: |
                  # GITHUB_PATH applies to SUBSEQUENT steps; export for this one.
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                  export PATH="$HOME/.cargo/bin:$PATH"
                  rustc --version
                  cargo --version
                  rustup target list --installed

            - name: Build (Linux)
              run: cargo build --release --locked

            - name: Test
              run: cargo test --locked

            - name: Cross-compile (Windows)
              run: cargo build --release --locked --target x86_64-pc-windows-gnu

            - name: Package AppImage (Linux)
              if: startsWith(github.ref, 'refs/tags/v')
              run: bash packaging/appimage.sh target/release/apecs

            - name: Stage artifacts + checksums
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  set -euo pipefail
                  mkdir -p dist
                  cp target/release/apecs "dist/apecs-linux-x86_64"
                  cp target/x86_64-pc-windows-gnu/release/apecs.exe "dist/apecs-windows-x86_64.exe"
                  cp dist-appimage/*.AppImage dist/ 2>/dev/null || true
                  cd dist
                  sha256sum * > SHA256SUMS.txt
                  ls -la

            - name: Publish GitHub Release
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  tag="${GITHUB_REF_NAME}"
                  cat > release-notes.md <<'NOTES'
                  **Crypto systems engineering, handled.**

                  APECS Guardian handles crypto systems engineering — chain daemons, logs, telemetry, dashboards — so builders don't have to.

                  ## What is Guardian?

                  A read-only, hardened node monitor for crypto infrastructure. A single static binary auto-detects your chain daemons and reports live telemetry to your personal dashboard at `apecs.dev/guardian/<sessionid>`.

                  **Monitored chains (auto-detected, read-only):** Dash · Bitcoin · Bitcoin Cash · Avalanche · Dogecoin · Litecoin

                  ## Downloads

                  | File | Platform |
                  | --- | --- |
                  | `apecs-windows-x86_64.exe` | Windows — single binary, no installer |
                  | `apecs-linux-x86_64` | Linux — static binary |
                  | `apecs-linux-x86_64.AppImage` | Linux — self-contained AppImage |

                  Verify your download before running it:

                  ```sh
                  sha256sum -c SHA256SUMS.txt
                  ```

                  ## Quick start

                  ```sh
                  apecs run --key <your-apecs-key>
                  ```

                  The daemon prints your personal dashboard link. There is no inbound listener — the daemon polls **outbound** only.

                  ## Security model

                  1. **Read-only by default** — it observes and reports unless you pass `--allow-actions`.
                  2. **Closed action set** — `node_status`, `node_logs`, `collect_metrics`, fixed at compile time. No shell, ever.
                  3. **Signed actions only** — every action carries an Ed25519 signature; the daemon fails closed on anything forged, tampered, or expired.

                  Source, build instructions, and the full security model: [APECSdev/apecs-ops](https://github.com/APECSdev/apecs-ops)
                  NOTES
                  # Release title is the bare tag (e.g. 'v26.10.17'), per owner.
                  gh release create "$tag" dist/* \
                      --title "$tag" \
                      --notes-file release-notes.md \
                      --latest
