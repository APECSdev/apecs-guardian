# Cargo.toml
[package]
name = "apecs"
version = "26.10.17"
authors = ["APECS Dev"]
description = "apecs.exe — the APECS Guardian: a read-only, hardened node monitor for top-L1 operators."
homepage = "https://apecs.dev"
repository = "https://github.com/APECSdev/apecs-ops"
categories = ["blockchain", "cryptocurrency"]
keywords = ["dash", "bitcoin", "avalanche", "litecoin", "dogecoin", "node-monitor"]
license = "MIT"
edition = "2021"

[[bin]]
name = "apecs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.37", features = ["derive", "env"] }
human-panic = "2.0.2"
indicatif = "0.17.1"
reqwest = { version = "0.12.15", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.85"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4.3"
rand = "0.8.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1.3"

[profile.release]
# Small, hardened single binary.
lto = true
codegen-units = 1
panic = "abort"
strip = true
